# One-click backend deploy on Render (Blueprint). Import the repository at
# https://dashboard.render.com/blueprints and Render reads this file.
#
# Defaults to the free plan so importing this costs nothing. See the note at
# the bottom for what that trades away and how to make the data durable.
services:
  - type: web
    name: cyberwatch-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # No disk on the free plan, so the database lives in the container and is
      # discarded whenever it restarts. Startup refreshes current public sources;
      # historical backfill is opt-in and cannot restore user-entered data.
      - key: DATABASE_URL
        value: sqlite:////data/cyber_opp.db
      - key: BACKFILL_ON_EMPTY
        value: "false"
      # Keep the unattended first run small. A 12-year sweep is killed part-way
      # on a free instance, and with no disk that restarts it from nothing in a
      # loop. Raise this only on a plan with a disk.
      - key: BACKFILL_YEARS_BACK
        value: "2"
      - key: SCAN_INTERVAL_MINUTES
        value: "60"
      # Every source type that publishes an invitation, measured on a cold
      # boot: NCSA 0.8s/10 records, STATE_ENTERPRISE 12.6s/4, BOT 303s/30.
      # BOT is slow only because uncached AEM pages time out before Fastly
      # serves them, but it is the single largest source of notices, so it
      # earns its place. Omitting these three cost 44 records against the 9
      # the rest of the boot scan returns. EGP stays out: it is contract
      # history where every record already names a winner. It arrives via an
      # explicitly enabled backfill, or POST /api/scan?full=true.
      - key: SCAN_SOURCE_TYPES
        value: "ONCB,GOVERNMENT,CORPORATE,CUSTOM_WEB,NCSA,STATE_ENTERPRISE,BOT"
      # Not needed while the dashboard proxies /api through Netlify. Set it to
      # the Netlify origin only if the frontend calls this API directly.
      - key: CORS_ORIGINS
        sync: false
      # Optional key from https://opend.data.go.th/register_api
      - key: DATA_GO_TH_API_KEY
        sync: false

# ---------------------------------------------------------------------------
# What the free plan costs you
#
#   * The instance sleeps after ~15 minutes idle. A sleeping instance runs no
#     scheduled scans, and the first request after it wakes is slow.
#   * There is no disk, so bookmarks, pipeline stages and notes you enter in
#     the dashboard are lost on every restart. Only records still available at
#     source can be refetched; first-seen history and anything typed are lost.
#
# To keep data: switch `plan: free` to `plan: starter` (paid) and add
#
#     disk:
#       name: cyberwatch-data
#       mountPath: /data
#       sizeGB: 5
#
# Check current pricing at https://render.com/pricing before switching — a
# paid plan bills your account.
# ---------------------------------------------------------------------------
